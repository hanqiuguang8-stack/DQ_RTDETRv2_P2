task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 10
remap_mscoco_category: True # 【关键修复】改为 True！让系统自动把 1-10 映射成 0-9，防止 CUDA 越界

train_dataloader: 
  type: DataLoader
  dataset: 
    type: CocoDetection
    # 【修改路径】指向扁平化后的图片目录
    img_folder: /mnt/sdb/dataset/2D/VisDrone2019/VisDrone2019-DET-train/images
    # 【修改路径】直接指向转换好的 json 文件
    ann_file: /mnt/sdb/dataset/2D/VisDrone2019/VisDrone2019-DET-train/train.json
    return_masks: False
    transforms:
      type: Compose
      # 【补齐预处理】VisDrone 强烈建议 Resize 到 1024
      ops: 
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBox, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [1024, 1024]} 
        - {type: SanitizeBoundingBox, min_size: 1}
        - {type: ConvertPILImageDtype, dtype: 'float32'}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  shuffle: True
  total_batch_size: 4 # 【关键修改】解决冲突报错
  num_workers: 16 
  drop_last: True 
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset: 
    type: CocoDetection
    img_folder: /mnt/sdb/dataset/2D/VisDrone2019/VisDrone2019-DET-val/images
    ann_file: /mnt/sdb/dataset/2D/VisDrone2019/VisDrone2019-DET-val/val.json
    return_masks: False
    transforms:
      type: Compose
      ops: 
        - {type: Resize, size: [1024, 1024]} 
        - {type: ConvertPILImageDtype, dtype: 'float32'}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  shuffle: False
  total_batch_size: 8 # 【关键修改】解决冲突报错
  num_workers: 8
  drop_last: False 
  collate_fn:
    type: BatchImageCollateFunction